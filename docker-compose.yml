services:
  postgres:
    image: postgres:16-alpine
    container_name: slp-postgres
    environment:
      POSTGRES_DB: project_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    image: ayushraina1208/slp-eureka-server:1.0
    container_name: slp-eureka-server
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  devotee-service:
    image: ayushraina1208/slp-devotee-service:3.0
    container_name: slp-devotee-service
    volumes:
    - "./exports:/app/exports"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8081:8081"

  api-gateway:
    image: ayushraina1208/slp-api-gateway:1.0
    container_name: slp-api-gateway
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      devotee-service:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    image: ayushraina1208/slp-frontend:2.0
    container_name: slp-frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:80"

volumes:
  postgres-data: